<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 100% Climb: Percentages | IMS Jaipur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#10293b;--muted:#567082;--line:#d3e0e8;--pine:#2f6554;--pine-d:#1f4c3e;--rust:#c93a2b;--sun:#f7c95c;--snow:#fff;--ok:#14734c;--ok-l:#dff5ea;--bad:#b83232;--bad-l:#fcebe9;--amb:#a0660a;--amb-l:#fff3dc;--fs:1.2}
*{box-sizing:border-box}
html,body{margin:0}
body{color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55;min-height:100vh;background:#e4f0f6;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--rust);outline-offset:2px}
h1,h2,.disp{font-family:"Bricolage Grotesque",Manrope,sans-serif}
.top{background:var(--pine-d);color:#fff}
.top-in{max-width:1320px;margin:auto;padding:9px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-weight:800;font-size:1.3rem;margin:0;letter-spacing:-.01em;flex:1 1 auto;min-width:0}
.ctl{display:flex;align-items:center;gap:6px}
.chip{background:#2f6554;color:#fff;border-radius:8px;padding:6px 11px;font-size:.85rem;font-weight:700;min-height:36px;transition:background .15s}
.chip:hover{background:#3d7c68}
.tally{font-family:"JetBrains Mono",monospace;font-size:.88rem;white-space:nowrap}
.wrap{flex:1;width:100%;max-width:1320px;margin:auto;padding:16px 18px 22px;display:grid;grid-template-columns:minmax(280px,340px) minmax(0,1fr);gap:18px;align-items:start}
.scene{position:sticky;top:12px;height:calc(100vh - 90px);min-height:520px;max-height:800px;border-radius:18px;overflow:hidden;background:#f6d9c4}
.sky{position:absolute;inset:0;opacity:0;transition:opacity 1.2s}
.sky.s0{background:linear-gradient(#5e6fa8,#e9a99a 58%,#f8d9b4)}
.sky.s1{background:linear-gradient(#6fa8d8,#f3d6c0 70%)}
.sky.s2{background:linear-gradient(#4f9fe0,#bfe3f5 75%)}
.sky.s3{background:linear-gradient(#2c86d9,#a9dcf7 80%)}
.sky.on{opacity:1}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.sunG{transition:transform 1.4s ease-out}
.cl{animation:drift 26s linear infinite alternate}
.cl.b{animation-duration:38s;animation-direction:alternate-reverse}
@keyframes drift{from{transform:translateX(-24px)}to{transform:translateX(30px)}}
.done-trail{transition:stroke-dasharray 1s ease-out}
.flagG{transition:transform 1s cubic-bezier(.3,1.3,.5,1)}
.wave{transform-origin:0 -28px;animation:wave 1.6s ease-in-out infinite}
@keyframes wave{50%{transform:skewY(-9deg) scaleX(.92)}}
.lab{font-family:Manrope,sans-serif;font-weight:800;font-size:13px;fill:#10293b;paint-order:stroke;stroke:#fff;stroke-width:3.5px;stroke-linejoin:round}
.big{position:absolute;left:16px;top:12px;z-index:2;color:#fff;text-shadow:0 1px 8px rgba(16,41,59,.55)}
.big b{font-family:"Bricolage Grotesque",sans-serif;font-size:2.7rem;font-weight:800;line-height:1;display:block}
.big span{font-size:.85rem;font-weight:700}
.col{min-width:0}
.card{position:relative;background:#fff;border-radius:18px;padding:clamp(16px,2.4vw,28px);box-shadow:0 8px 26px rgba(16,41,59,.09);overflow:hidden;border-top:6px solid var(--stage,#2f6554)}
.meta{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.badge{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:.9rem}
.badge i{font-style:normal;background:var(--stage,#2f6554);color:#fff;border-radius:99px;padding:3px 12px}
.badge span{color:var(--muted);font-family:"JetBrains Mono",monospace;font-weight:700}
.timer{display:flex;align-items:center;gap:4px;font-family:"JetBrains Mono",monospace;font-weight:700}
.timer output{font-size:1.1rem;min-width:3.3em;text-align:center}
.timer button{border:1px solid var(--line);border-radius:7px;padding:4px 9px;font-size:.78rem;font-family:Manrope,sans-serif;font-weight:700;min-height:34px}
.timer button:hover{background:#eef5f8}
.q{font-size:calc(1rem*var(--fs));line-height:1.55;margin:0 0 4px}
.src{font-weight:800;color:var(--pine);white-space:nowrap}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;background:#f6fafc;border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-size:calc(.95rem*var(--fs));min-height:52px;transition:transform .12s,border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--pine);transform:translateY(-2px)}
.opt b{color:var(--pine);font-family:"JetBrains Mono",monospace}
.opt.ok{background:var(--ok-l);border-color:var(--ok);font-weight:800}
.opt.bad{background:var(--bad-l);border-color:var(--bad);text-decoration:line-through}
.opt:disabled{cursor:default}
.tita{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.tita input{flex:1 1 170px;min-width:0;max-width:280px;border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-family:"JetBrains Mono",monospace;font-size:calc(1rem*var(--fs));background:#f6fafc}
.tita input:focus{border-color:var(--pine);outline:none}
.tita input.ok{background:var(--ok-l);border-color:var(--ok);font-weight:700}
.tita input.bad{background:var(--bad-l);border-color:var(--bad)}
.btn{border-radius:11px;padding:10px 18px;font-weight:800;min-height:46px;transition:transform .12s,background .12s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn.pri{background:var(--pine-d);color:#fff}
.btn.pri:hover{background:var(--pine)}
.btn.up{background:var(--rust);color:#fff}
.btn.up:hover{background:#ae2f22}
.btn.sec{background:#fff;border:2px solid var(--line)}
.btn.sec:hover{border-color:var(--pine)}
.btn:disabled{opacity:.45;cursor:default}
.fb{min-height:1.5em;margin:10px 0 0;font-weight:800;font-size:calc(.88rem*var(--fs))}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.sol{margin-top:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ansline{margin:0;padding:9px 15px;background:var(--amb-l);border-radius:10px;font-size:calc(.98rem*var(--fs));color:#6a4405}
.ansline b{color:var(--ink)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:12px}
.route{margin-top:14px;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 4px 16px rgba(16,41,59,.06)}
.leg{display:grid;grid-template-columns:118px minmax(0,1fr);gap:8px;align-items:center;padding:3px 0}
.leg strong{font-size:.8rem;font-weight:800;color:var(--c)}
.pal{display:flex;flex-wrap:wrap;gap:5px}
.pal button{width:36px;height:34px;border-radius:8px;background:#f2f7fa;border:1px solid var(--line);font-family:"JetBrains Mono",monospace;font-size:.82rem;font-weight:700;color:var(--muted)}
.pal button:hover{border-color:var(--pine)}
.pal .ok{background:var(--ok-l);border-color:var(--ok);color:var(--ok)}
.pal .bad{background:var(--bad-l);border-color:var(--bad);color:var(--bad)}
.pal .seen{background:var(--amb-l);border-color:#d9a24a;color:var(--amb)}
.pal .cur{outline:3px solid var(--ink);outline-offset:1px}
.key{display:flex;flex-wrap:wrap;gap:12px;font-size:.75rem;color:var(--muted);margin-top:7px}
.key i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid}
.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,120px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:99px;font-weight:800;z-index:9;transition:transform .35s cubic-bezier(.3,1.3,.5,1);max-width:calc(100vw - 32px);text-align:center;font-size:.95rem}
.toast.on{transform:translate(-50%,0)}
.bit{position:absolute;top:-10px;width:9px;height:14px;border-radius:2px;animation:fall .95s ease-in forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(240px) rotate(420deg);opacity:0}}
.res h2{font-size:1.9rem;font-weight:800;margin:0}
.res .score{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(2.6rem,7vw,4rem);color:var(--pine);line-height:1.1;margin:6px 0}
.res p{margin:6px 0}
.legs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin:14px 0}
.legs div{background:#f2f7fa;border-radius:12px;padding:10px 12px;border-top:4px solid var(--c)}
.legs b{display:block;font-family:"JetBrains Mono",monospace;font-size:1.25rem}
.legs span{font-size:.82rem;font-weight:700;color:var(--muted)}
.reslist{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.reslist button{min-width:42px;height:40px;border-radius:8px;border:1px solid var(--line);font-family:"JetBrains Mono",monospace;font-weight:700;background:#f2f7fa}
.reslist.w button{background:var(--bad-l);border-color:var(--bad);color:var(--bad)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
footer{color:var(--muted);font-size:.82rem;padding:2px 18px 12px}
footer div{max-width:1284px;margin:auto;display:flex;justify-content:space-between;gap:10px}
@media(max-width:860px){:root{--fs:1.05}
 .wrap{grid-template-columns:minmax(0,1fr);padding:12px 14px 18px;gap:12px}
 .scene{position:relative;top:0;height:150px;min-height:0;border-radius:14px}
 #mtn{display:none}#strip{display:block!important}
 .big{top:9px;left:13px}.big b{font-size:1.75rem}.big span{font-size:.75rem}
 .top h1{font-size:1.08rem;flex-basis:100%}.top-in{justify-content:space-between;padding:8px 14px}
 .txt{display:none}.opts{grid-template-columns:minmax(0,1fr)}.nav .btn{flex:1}
 .leg{grid-template-columns:minmax(0,1fr);gap:3px;padding:5px 0}
 .pal button{width:34px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.clock{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:1.3rem;background:#123a2f;border-radius:9px;padding:3px 12px;white-space:nowrap}
.clock:empty{display:none}
.clock.open{background:#1f7fa8;font-size:.9rem;padding:7px 12px}
.tally{font-size:1.05rem;font-weight:700}
.worth{font-weight:800;font-size:.9rem;color:var(--pine);background:#e6f3ee;border-radius:99px;padding:4px 13px}
.pal .half{background:#dff1f8;border-color:#1f7fa8;color:#14607f}
.banner{background:var(--amb-l);border:2px solid #d9a24a;border-radius:14px;padding:12px 16px;margin-bottom:12px}
.codeF{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
.codeF input{flex:1 1 150px;max-width:230px;min-width:0;border:2px solid var(--line);border-radius:11px;padding:10px 13px;font-family:"JetBrains Mono",monospace;text-transform:uppercase;background:#fff}
.err{color:var(--bad);font-weight:700;font-size:.88rem;margin:4px 0 0;min-height:1.2em}
.start h2{font-size:clamp(1.9rem,4vw,2.7rem);font-weight:800;margin:0}
.lead{font-size:1.1rem;margin:4px 0 0;color:var(--muted);font-weight:500}
.rules{margin:4px 0 2px;padding-left:20px}.rules li{margin:5px 0}
@media(max-width:860px){.top-in{flex-wrap:nowrap;gap:10px;padding:7px 12px}.top h1{flex:1 1 auto;flex-basis:auto;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tally{font-size:.9rem}.chip{padding:5px 10px;min-height:32px;font-size:.8rem}.wrap{padding:10px 12px 16px}.scene{height:112px}.big b{font-size:1.45rem}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <h1>PERCENTAGES: CAT PYQs</h1>
  <span class="tally" id="tally" aria-live="polite"></span>
  <div class="ctl"><button class="chip" id="finish">Results</button></div>
</div></header>
<div class="wrap">
  <aside class="scene" aria-hidden="true">
    <div class="sky s0 on"></div><div class="sky s1"></div><div class="sky s2"></div><div class="sky s3"></div>
    <div class="big"><b id="pct">0%</b><span id="where">Base Camp</span></div>
    <svg id="mtn" viewBox="0 0 340 640" preserveAspectRatio="xMidYMax slice">
      <g class="sunG" id="sun"><circle cx="286" cy="0" r="26" fill="#f7c95c"/><circle cx="286" cy="0" r="38" fill="#f7c95c" opacity=".25"/></g>
      <g fill="#fff" opacity=".8"><g class="cl"><ellipse cx="118" cy="168" rx="36" ry="10"/><ellipse cx="100" cy="161" rx="19" ry="9"/></g><g class="cl b"><ellipse cx="296" cy="205" rx="30" ry="9"/><ellipse cx="312" cy="198" rx="17" ry="8"/></g></g>
      <polygon points="-10,640 -10,350 70,270 140,380 340,300 340,640" fill="#a7c5d6"/>
      <polygon points="0,640 205,105 350,640" fill="#6c97ae"/>
      <polygon points="205,105 350,640 225,640 190,420 228,300 196,210" fill="#55809a"/>
      <polygon points="205,105 248,218 226,204 212,236 196,208 180,232 166,208" fill="#fff"/>
      <polygon points="-10,640 -10,540 90,500 190,560 350,500 350,640" fill="#3f7a68"/>
      <polygon points="-10,640 -10,595 110,575 240,615 350,580 350,640" fill="#2f6554"/>
      <g fill="#1f4c3e"><polygon points="26,600 38,566 50,600"/><polygon points="50,606 60,578 70,606"/><polygon points="288,600 300,566 312,600"/><polygon points="312,604 322,578 332,604"/></g>
      <path id="trail" d="M72 606 C130 596 214 586 246 534 S126 478 116 424 S250 372 254 316 S150 258 162 212 S212 150 205 112" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="3 7" stroke-linecap="round" opacity=".9"/>
      <path id="trailDone" class="done-trail" pathLength="100" stroke-dasharray="0 100" d="M72 606 C130 596 214 586 246 534 S126 478 116 424 S250 372 254 316 S150 258 162 212 S212 150 205 112" fill="none" stroke="#c93a2b" stroke-width="4" stroke-linecap="round"/>
      <g id="camps"></g>
      <g class="flagG" id="flag"><line x1="0" y1="0" x2="0" y2="-30" stroke="#10293b" stroke-width="3" stroke-linecap="round"/><polygon class="wave" points="1,-30 25,-22 1,-13" fill="#c93a2b"/></g>
    </svg>
    <svg id="strip" viewBox="0 0 360 150" preserveAspectRatio="xMidYMax slice" style="display:none">
      <circle cx="300" cy="34" r="16" fill="#f7c95c"/>
      <polygon points="0,150 0,128 340,28 360,150" fill="#6c97ae"/>
      <polygon points="340,28 324,33 330,47 340,41 350,50 345,28" fill="#fff"/>
      <polygon points="0,150 0,132 120,120 250,140 360,122 360,150" fill="#2f6554"/>
      <path id="trailS" d="M18 128 L340 34" fill="none" stroke="#fff" stroke-width="2.5" stroke-dasharray="3 6" stroke-linecap="round"/>
      <path id="doneS" class="done-trail" pathLength="100" stroke-dasharray="0 100" d="M18 128 L340 34" fill="none" stroke="#c93a2b" stroke-width="3.5" stroke-linecap="round"/>
      <g class="flagG" id="flagS"><line x1="0" y1="0" x2="0" y2="-24" stroke="#10293b" stroke-width="2.5"/><polygon points="1,-24 19,-18 1,-11" fill="#c93a2b"/></g>
    </svg>
  </aside>
  <div class="col"><section id="view"></section>
    <nav class="route" id="rt" aria-label="Question list"><div id="pal"></div>
      <div class="key"><span><i style="background:var(--ok-l);border-color:var(--ok)"></i>Right first try</span><span><i style="background:var(--bad-l);border-color:var(--bad)"></i>Wrong</span></div>
    </nav></div>
</div>
<footer><div><span>IMS Jaipur</span><span>Smarth Sir</span></div></footer>
<div class="toast" id="toast" role="status"></div>
<script>
const QS=[{"q": "Out of the shirts produced in a factory, 15% are defective, while 20% of the rest are sold in the domestic market. If the remaining 8840 shirts are left for export, then the number of shirts produced in the factory is", "src": "CAT 2017 Slot 2", "opts": ["13600", "13000", "13400", "14000"], "ans": "b"}, {"q": "Ravi invests 50% of his monthly savings in fixed deposits. Thirty percent of the rest of his savings is invested in stocks and the rest goes into Ravi's savings bank account. If the total amount deposited by him in the bank (for savings account and fixed deposits) is Rs 59500, then Ravi's total monthly savings (in Rs) is ______.", "src": "CAT 2017 Slot 1", "opts": null, "ans": "70000"}, {"q": "A certain amount of money was divided among Pinu, Meena, Rinu and Seema. Pinu received 20% of the total amount and Meena received 40% of the remaining amount. If Seema received 20% less than Pinu, the ratio of the amounts received by Pinu and Rinu is", "src": "CAT 2025 Slot 2", "opts": ["5 : 8", "2 : 1", "1 : 2", "8 : 5"], "ans": "a"}, {"q": "In an examination, the score of A was 10% less than that of B, the score of B was 25% more than that of C, and the score of C was 20% less than that of D. If A scored 72, then the score of D was ______.", "src": "CAT 2019 Slot 2", "opts": null, "ans": "80"}, {"q": "Arun's present age in years is 40% of Barun's. In another few years, Arun's age will be half of Barun's. By what percentage will Barun's age increase during this period?", "src": "CAT 2017 Slot 1", "opts": null, "ans": "20"}, {"q": "The number of girls appearing for an admission test is twice the number of boys. If 30% of the girls and 45% of the boys get admission, the percentage of candidates who do not get admission is", "src": "CAT 2017 Slot 1", "opts": ["35", "50", "60", "65"], "ans": "d"}, {"q": "In a class, 60% of the students are girls and the rest are boys. There are 30 more girls than boys. If 68% of the students, including 30 boys, pass an examination, the percentage of the girls who do not pass is ______.", "src": "CAT 2019 Slot 1", "opts": null, "ans": "20"}, {"q": "In May, John bought the same amount of rice and the same amount of wheat as he had bought in April, but spent ₹150 more due to price increase of rice and wheat by 20% and 12%, respectively. If John had spent ₹450 on rice in April, then how much did he spend on wheat in May?", "src": "CAT 2020 Slot 2", "opts": ["590", "580", "560", "570"], "ans": "c"}, {"q": "In 2010, a library contained a total of 11500 books in two categories - fiction and non-fiction. In 2015, the library contained a total of 12760 books in these two categories. During this period, there was 10% increase in the fiction category while there was 12% increase in the non-fiction category. How many fiction books were in the library in 2015?", "src": "CAT 2019 Slot 2", "opts": ["6600", "6160", "6000", "5500"], "ans": "a"}, {"q": "A box has 450 balls, each either white or black, there being as many metallic white balls as metallic black balls. If 40% of the white balls and 50% of the black balls are metallic, then the number of non-metallic balls in the box is ______.", "src": "CAT 2021 Slot 2", "opts": null, "ans": "250"}, {"q": "The income of Amala is 20% more than that of Bimala and 20% less than that of Kamala. If Kamala's income goes down by 4% and Bimala's goes up by 10%, then the percentage by which Kamala's income would exceed Bimala's is nearest to", "src": "CAT 2019 Slot 1", "opts": ["28", "29", "31", "32"], "ans": "c"}, {"q": "In the final examination, Bishnu scored 52% and Asha scored 64%. The marks obtained by Bishnu is 23 less, and that by Asha is 34 more than the marks obtained by Ramesh. The marks obtained by Geeta, who scored 84%, is", "src": "CAT 2020 Slot 3", "opts": ["399", "439", "357", "417"], "ans": "a"}, {"q": "Meena scores 40% in an examination and after review, even though her score is increased by 50%, she fails by 35 marks. If her post-review score is increased by 20%, she will have 7 marks more than the passing score. The percentage score needed for passing the examination is", "src": "CAT 2019 Slot 1", "opts": ["75", "80", "60", "70"], "ans": "d"}, {"q": "In a village, the production of food grains increased by 40% and the per capita production of food grains increased by 27% during a certain period. The percentage by which the population of the village increased during the same period is nearest to", "src": "CAT 2017 Slot 2", "opts": ["16", "13", "10", "7"], "ans": "c"}, {"q": "Identical chocolate pieces are sold in boxes of two sizes, small and large. The large box is sold for twice the price of the small box. If the selling price per gram of chocolate in the large box is 12% less than that in the small box, then the percentage by which the weight of chocolate in the large box exceeds that in the small box is nearest to", "src": "CAT 2021 Slot 1", "opts": ["144", "127", "135", "124"], "ans": "b"}, {"q": "In an examination, the maximum possible score is N while the pass mark is 45% of N. A candidate obtains 36 marks, but falls short of the pass mark by 68%. Which one of the following is then correct?", "src": "CAT 2018 Slot 1", "opts": ["N ≤ 200", "243 ≤ N ≤ 252", "N ≥ 253", "201 ≤ N ≤ 242"], "ans": "b"}, {"q": "In a company, 20% of the employees work in the manufacturing department. If the total salary obtained by all the manufacturing employees is one-sixth of the total salary obtained by all the employees in the company, then the ratio of the average salary obtained by the manufacturing employees to the average salary obtained by the nonmanufacturing employees is", "src": "CAT 2023 Slot 2", "opts": ["4 : 5", "5 : 6", "5 : 4", "6 : 5"], "ans": "a"}, {"q": "In a group of people, 28% of the members are young while the rest are old. If 65% of the members are literates, and 25% of the literates are young, then the percentage of old people among the illiterates is nearest to", "src": "CAT 2020 Slot 1", "opts": ["59", "62", "66", "55"], "ans": "c"}, {"q": "In a tournament, a team has played 40 matches so far and won 30% of them. If they win 60% of the remaining matches, their overall win percentage will be 50%. Suppose they win 90% of the remaining matches, then the total number of matches won by the team in the tournament will be", "src": "CAT 2021 Slot 3", "opts": ["86", "84", "78", "80"], "ans": "b"}, {"q": "Kamala divided her investment of Rs 100000 between stocks, bonds, and gold. Her investment in bonds was 25% of her investment in gold. With annual returns of 10%, 6%, 8% on stocks, bonds, and gold, respectively, she gained a total amount of Rs 8200 in one year. The amount, in rupees, that she gained from the bonds, was ______.", "src": "CAT 2025 Slot 1", "opts": null, "ans": "900"}, {"q": "The average salary of 5 managers and 25 engineers in a company is Rs 60000. If each of the managers receives a 20% hike in salary while the salary of the engineers remains unchanged, the average salary of all 30 employees increases by 5%. The average salary of the engineers, in rupees, is", "src": "CAT 2025 Slot 3", "opts": ["45000", "54000", "50000", "40000"], "ans": "b"}, {"q": "The salaries of three friends Sita, Gita and Mita are initially in the ratio 5 : 6 : 7, respectively. In the first year, they get salary hikes of 20%, 25% and 20%, respectively. In the second year, Sita and Mita get salary hikes of 40% and 25%, respectively, and the salary of Gita becomes equal to the mean salary of the three friends. The salary hike of Gita in the second year is", "src": "CAT 2023 Slot 1", "opts": ["26%", "28%", "25%", "30%"], "ans": "a"}, {"q": "After two successive increments, Gopal's salary became 187.5% of his initial salary. If the percentage of salary increase in the second increment was twice of that in the first increment, then the percentage of salary increase in the first increment was", "src": "CAT 2024 Slot 3", "opts": ["27.5", "30", "25", "20"], "ans": "c"}, {"q": "Raj invested ₹10000 in a fund. At the end of first year, he incurred a loss but his balance was more than ₹5000. This balance, when invested for another year, grew and the percentage of growth in the second year was five times the percentage of loss in the first year. If the gain of Raj from the initial investment over the two year period is 35%, then the percentage of loss in the first year is", "src": "CAT 2021 Slot 2", "opts": ["15", "5", "10", "70"], "ans": "c"}, {"q": "In an election, there were four candidates and 80% of the registered voters casted their votes. One of the candidates received 30% of the casted votes while the other three candidates received the remaining casted votes in the proportion 1 : 2 : 3. If the winner of the election received 2512 votes more than the candidate with the second highest votes, then the number of registered voters was", "src": "CAT 2022 Slot 2", "opts": ["60288", "50240", "40192", "62800"], "ans": "d"}, {"q": "In September, the incomes of Kamal, Amal and Vimal are in the ratio 8 : 6 : 5. They rent a house together, and Kamal pays 15%, Amal pays 12% and Vimal pays 18% of their respective incomes to cover the total house rent in that month. In October, the house rent remains unchanged while their incomes increase by 10%, 12% and 15%, respectively. In October, the percentage of their total income that will be paid as house rent, is nearest to", "src": "CAT 2024 Slot 1", "opts": ["14.84", "12.75", "13.26", "15.18"], "ans": "c"}, {"q": "The total of male and female populations in a city increased by 25% from 1970 to 1980. During the same period, the male population increased by 40% while the female population increased by 20%. From 1980 to 1990, the female population increased by 25%. In 1990, if the female population is twice the male population, then the percentage increase in the total of male and female populations in the city from 1970 to 1990 is", "src": "CAT 2021 Slot 3", "opts": ["68.25", "68.75", "68.50", "69.25"], "ans": "b"}, {"q": "In a class, there were more than 10 boys and a certain number of girls. After 40% of the girls and 60% of the boys left the class, the remaining number of girls was 8 more than the remaining number of boys. Then, the minimum possible number of students initially in the class was ______.", "src": "CAT 2025 Slot 1", "opts": null, "ans": "55"}, {"q": "In a group of 250 students, the percentage of girls was at least 44% and at most 60%. The rest of the students were boys. Each student opted for either swimming or running or both. If 50% of the boys and 80% of the girls opted for swimming while 70% of the boys and 60% of the girls opted for running, then the minimum and maximum possible number of students who opted for both swimming and running, are", "src": "CAT 2024 Slot 3", "opts": ["75 and 90", "72 and 80", "75 and 96", "72 and 88"], "ans": "b"}, {"q": "The population of a town in 2020 was 100000. The population decreased by y% from the year 2020 to 2021, and increased by x% from the year 2021 to 2022, where x and y are two natural numbers. If population in 2022 was greater than the population in 2020 and the difference between x and y is 10, then the lowest possible population of the town in 2021 was", "src": "CAT 2023 Slot 3", "opts": ["74000", "75000", "72000", "73000"], "ans": "d"}, {"q": "A fruit seller has a stock of mangoes, bananas and apples with at least one fruit of each type. At the beginning of a day, the number of mangoes make up 40% of his stock. That day, he sells half of the mangoes, 96 bananas and 40% of the apples. At the end of the day, he ends up selling 50% of the fruits. The smallest possible total number of fruits in the stock at the beginning of the day is ______.", "src": "CAT 2023 Slot 3", "opts": null, "ans": "340"}];
const STAGES=[{n:'Base Camp',from:0,to:10,c:'#2f6554',pts:10},{n:'Ridge',from:10,to:18,c:'#1f7fa8',pts:20},{n:'High Camp',from:18,to:27,c:'#a0660a',pts:30},{n:'Summit',from:27,to:31,c:'#c93a2b',pts:50}];
const KEY='ims-percent-sprint-v3';
let S={name:'',end:null,cur:0,a:{},shown:{},seen:{},streak:0,bonus:0,fs:null};
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.a)S=Object.assign(S,v);}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const st=i=>S.a[i]||(S.a[i]={tries:[],first:null,pts:0});
const stageOf=i=>STAGES.find(s=>i>=s.from&&i<s.to);
const phase=()=>!S.end?'start':'play';
let showRes=false,draft=null;
const seenCount=()=>QS.reduce((n,q,i)=>n+(S.seen[i]?1:0),0);
function totals(){let right=0,wrong=[],skip=[],pts=S.bonus;QS.forEach((q,i)=>{const a=S.a[i];if(a){pts+=a.pts;if(a.first===true)right++;}
  if(a&&a.first===false)wrong.push(i);else if(!a||a.first===null)skip.push(i);});return{right,wrong,skip,pts};}
function place(id,pathId,f){const p=$(pathId);try{const L=p.getTotalLength();if(!L)return;const pt=p.getPointAtLength(L*f);$(id).style.transform='translate('+pt.x+'px,'+pt.y+'px)';}catch(e){}}
function camps(){const g=$('camps'),p=$('trail');let L;try{L=p.getTotalLength();}catch(e){return;}if(!L)return;
  const pts=[[0,'Base Camp',14,-8,'start'],[10/31,'Ridge',-12,4,'end'],[18/31,'High Camp',-12,4,'end'],[27/31,'Summit push',14,4,'start']];
  g.innerHTML=pts.map(a=>{const t=p.getPointAtLength(L*a[0]);return '<circle cx="'+t.x+'" cy="'+t.y+'" r="6" fill="#fff" stroke="#10293b" stroke-width="2.5"/><text class="lab" x="'+(t.x+a[2])+'" y="'+(t.y+a[3])+'" text-anchor="'+a[4]+'">'+a[1]+'</text>';}).join('');}
function climb(){const n=seenCount(),f=n/QS.length,pct=Math.round(f*100),s=n>=27?3:n>=18?2:n>=10?1:0;
  document.querySelectorAll('.sky').forEach((e,i)=>e.classList.toggle('on',i===s));
  $('pct').textContent=pct+'%';$('where').textContent=n>=31?'Summit reached':'Climbing: '+STAGES[s].n;
  $('trailDone').setAttribute('stroke-dasharray',pct+' 100');$('doneS').setAttribute('stroke-dasharray',pct+' 100');
  place('flag','trail',f);place('flagS','trailS',f);$('sun').style.transform='translateY('+(300-f*238)+'px)';
  $('tally').textContent=totals().pts+' pts';}
function clock(){$('finish').style.display=phase()==='start'?'none':'';}
function palette(){const p=$('pal');p.innerHTML='';
  STAGES.forEach(s=>{const r=document.createElement('div');r.className='leg';r.style.setProperty('--c',s.c);
    const l=document.createElement('strong');l.textContent=s.n+' · '+s.pts;r.appendChild(l);
    const w=document.createElement('div');w.className='pal';
    for(let i=s.from;i<s.to;i++){const b=document.createElement('button');b.textContent=i+1;b.setAttribute('aria-label','Question '+(i+1));
      const a=S.a[i];if(a&&a.first===true)b.className='ok';else if(a&&a.first===false)b.className='bad';else if(S.seen[i])b.className='seen';
      if(i===S.cur&&!showRes){b.classList.add('cur');b.setAttribute('aria-current','true');}
      b.onclick=()=>go(i);w.appendChild(b);}
    r.appendChild(w);p.appendChild(r);});}
function go(i){showRes=false;draft=null;S.cur=Math.max(0,Math.min(QS.length-1,i));save();render();window.scrollTo({top:0});}
let tT;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2800);}
function mark(i){const before=seenCount();if(S.seen[i])return;S.seen[i]=true;const n=before+1;
  if(n===10)toast('Base Camp cleared. On to the Ridge!');else if(n===18)toast('Ridge crossed. High Camp ahead!');else if(n===27)toast('High Camp done. Summit push!');else if(n===31)toast('Summit reached: 100%!');}
function burst(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const c=document.querySelector('.card');if(!c)return;const cols=['#c93a2b','#f7c95c','#2f6554','#1f7fa8'];
  for(let k=0;k<16;k++){const d=document.createElement('i');d.className='bit';d.style.left=(4+Math.random()*92)+'%';d.style.background=cols[k%4];d.style.animationDelay=(Math.random()*.2)+'s';c.appendChild(d);setTimeout(()=>d.remove(),1250);}}
function canAnswer(i){const a=S.a[i];return phase()==='play'&&!S.shown[i]&&(!a||a.first===null);}
function submit(i,right,val){const a=st(i),sg=stageOf(i);a.tries.push(val);a.first=right;
  if(right){a.pts=sg.pts;S.streak++;if(S.streak%3===0){S.bonus+=10;toast('Rope bonus! +10 for 3 in a row');}mark(i);}else S.streak=0;
  save();render();if(right)burst();}
const ansText=q=>q.opts?'('+q.ans+') '+q.opts['abcd'.indexOf(q.ans)]:q.ans;
function startView(v){v.innerHTML='<div class="card start"><h2>The 100% Climb</h2><p class="lead">31 CAT questions. How high can you get?</p>'+
 '<div class="legs">'+STAGES.map(s=>'<div style="--c:'+s.c+'"><b>'+s.pts+'</b><span>'+s.n+' (Q'+(s.from+1)+'–'+s.to+')</span></div>').join('')+'</div>'+
 '<ul class="rules"><li>You get <b>one try</b> per question.</li><li>Get 3 right in a row for a <b>+10 rope bonus</b>.</li><li>Pick your route: easy points, or risk the hard ones.</li></ul>'+
 '<form id="sf" class="tita"><input id="nm" autocomplete="name" placeholder="Your name" aria-label="Your name" style="font-family:Manrope,sans-serif"><button class="btn up">Start climbing</button></form><p class="err" id="se" role="alert"></p></div>';
 $('sf').onsubmit=e=>{e.preventDefault();const n=$('nm').value.trim();if(!n){$('se').textContent='Enter your name first.';return;}S.name=n.slice(0,40);S.end=Date.now();save();clock();render();window.scrollTo({top:0});};
 $('nm').oninput=()=>{$('se').textContent='';};}
function render(){
  palette();climb();const v=$('view'),p=phase();$('rt').style.display=p==='start'?'none':'';
  if(p==='start'){startView(v);return;}
  if(showRes){results(v);return;}
  const i=S.cur,q=QS[i],a=S.a[i]||{tries:[],first:null,pts:0},sh=!!S.shown[i],sg=stageOf(i),can=canAnswer(i),solved=a.first===true;
  let h='';
  h+='<div class="card" style="--stage:'+sg.c+'"><div class="meta"><span class="badge"><i>'+sg.n+'</i><span>Q'+(i+1)+' of '+QS.length+'</span></span><span class="worth">'+(a.pts?'+'+a.pts+' earned':(a.first===false?'No points':'Worth '+sg.pts+' pts'))+'</span></div>';
  h+='<p class="q">'+esc(q.q)+' <span class="src">('+esc(q.src)+')</span></p>';
  if(q.opts){h+='<div class="opts">';q.opts.forEach((o,k)=>{const l='abcd'[k],tried=a.tries.includes(l);let c='opt';
      if(tried)c+=(l===q.ans?' ok':' bad');else if(sh&&l===q.ans)c+=' ok';
      h+='<button class="'+c+'" data-l="'+l+'"'+((!can||tried)?' disabled':'')+'><b>('+l+')</b><span>'+esc(o)+'</span></button>';});h+='</div>';}
  else{const last=draft!==null?draft:(a.tries.length?a.tries[a.tries.length-1]:'');
    h+='<form class="tita" id="tf"><input id="ti" inputmode="decimal" autocomplete="off" placeholder="Type your answer" aria-label="Your answer" value="'+esc(last)+'" class="'+(solved?'ok':(a.tries.length?'bad':''))+'"'+(can?'':' disabled')+'><button class="btn pri"'+(can?'':' disabled')+'>Check</button></form>';}
  let fb='';
  if(a.first===true)fb='<p class="fb ok" aria-live="polite">Correct! +'+a.pts+' points.</p>';
  else if(a.first===false)fb='<p class="fb bad" aria-live="polite">Not quite.</p>';
  else fb='<p class="fb" aria-live="polite"></p>';
  h+=fb;
  if(a.first===false)h+='<div class="sol">'+(sh?'<p class="ansline">Correct answer: <b>'+esc(ansText(q))+'</b></p>':'<button class="btn sec" id="show">Show answer</button>')+'</div>';
  h+='</div><div class="nav"><button class="btn sec" id="prev"'+(i===0?' disabled':'')+'>← Previous</button>'+(i===QS.length-1?'<button class="btn pri" id="res2">See results</button>':'<button class="btn pri" id="nxt">Next →</button>')+'</div>';
  v.innerHTML=h;
  v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b.dataset.l));
  if($('tf'))$('tf').onsubmit=e=>{e.preventDefault();typed();};
  if($('show'))$('show').onclick=()=>{S.shown[i]=true;mark(i);save();render();};
  if($('prev'))$('prev').onclick=()=>go(i-1);
  if($('nxt'))$('nxt').onclick=()=>go(i+1);
  if($('res2'))$('res2').onclick=openRes;
}
function pick(l){const i=S.cur,q=QS[i];if(!canAnswer(i)||(S.a[i]&&S.a[i].tries.includes(l)))return;submit(i,l===q.ans,l);}
const norm=s=>String(s).replace(/[,\s%₹]/g,'').replace(/^rs\.?/i,'');
function typed(){const i=S.cur,q=QS[i],raw=$('ti').value.trim();if(!raw||!canAnswer(i))return;draft=null;const n=Number(norm(raw));submit(i,!isNaN(n)&&n===Number(q.ans),raw);}
function openRes(){showRes=true;render();window.scrollTo({top:0});}
function shareText(){const t=totals();const nums=a=>a.length?a.map(i=>i+1).join(', '):'none';
  return 'Percentages: CAT PYQs (IMS Jaipur)\nName: '+S.name+'\nPoints: '+t.pts+' (includes rope bonus '+S.bonus+')\nRight first try: '+t.right+'/'+QS.length+''+'\nWrong: '+nums(t.wrong)+'\nNot attempted: '+nums(t.skip);}
function results(v){const t=totals(),n=seenCount();
  const list=(arr,cl)=>'<div class="reslist '+cl+'">'+arr.map(i=>'<button data-g="'+i+'">'+(i+1)+'</button>').join('')+'</div>';
  const legs=STAGES.map(s=>{let o=0;for(let i=s.from;i<s.to;i++)if(S.a[i]&&S.a[i].first===true)o++;return '<div style="--c:'+s.c+'"><b>'+o+'/'+(s.to-s.from)+'</b><span>'+s.n+'</span></div>';}).join('');
  v.innerHTML='<div class="card res"><h2>'+esc(S.name)+(n===QS.length?', summit reached!':', your climb')+'</h2><div class="score">'+t.pts+' pts</div><p>'+t.right+' right, plus '+S.bonus+' rope bonus points.</p><div class="legs">'+legs+'</div>'+
   (t.wrong.length?'<p><b>Wrong</b></p>'+list(t.wrong,'w'):'')+(t.skip.length?'<p><b>Not attempted</b></p>'+list(t.skip,''):'')+
   '<div class="acts"><button class="btn up" id="wa">Share on WhatsApp</button><button class="btn sec" id="cp">Copy result</button><button class="btn pri" id="back">Back to questions</button></div></div>';
  v.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>go(+b.dataset.g));
  $('back').onclick=()=>go(S.cur);
  $('wa').onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent(shareText()),'_blank');
  $('cp').onclick=async()=>{const b=$('cp');try{await navigator.clipboard.writeText(shareText());b.textContent='Copied';}catch(e){const ta=document.createElement('textarea');ta.value=shareText();document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(x){}ta.remove();b.textContent=ok?'Copied':'Could not copy';}};
  if(n===QS.length)burst();
}
$('finish').onclick=openRes;
document.addEventListener('keydown',e=>{if(phase()==='start'||showRes||e.target.tagName==='INPUT'||e.ctrlKey||e.metaKey||e.altKey)return;const q=QS[S.cur];
  if(e.key==='ArrowRight')go(S.cur+1);else if(e.key==='ArrowLeft')go(S.cur-1);
  else if(q.opts&&e.key.length===1&&'abcd'.includes(e.key.toLowerCase()))pick(e.key.toLowerCase());});
addEventListener('resize',()=>{camps();climb();});
load();
camps();render();clock();
</script>
</body>
</html>
